                const numNets = this.nextNet;
                const numRealUnknowns = numNets - 1; // net 0 = ground ไม่นับเป็น unknown
                const numSources = this.sources.length;
                const size = numRealUnknowns + numSources * 2; // แต่ละ source เพิ่ม virtual node + branch current
                if (size === 0) return { voltages: [0], vsCurrents: [] };

                const A = Array.from({ length: size }, () => new Array(size).fill(0));
                const b = new Array(size).fill(0);
                const idx = (net) => (net === 0 ? -1 : net - 1);

                this.resistors.forEach(({ p, n, r }) => {
                    const g = 1 / r;
                    const ip = idx(p), iN = idx(n);
                    if (ip >= 0) A[ip][ip] += g;
                    if (iN >= 0) A[iN][iN] += g;
                    if (ip >= 0 && iN >= 0) { A[ip][iN] -= g; A[iN][ip] -= g; }
                });

                const virtualBase = numRealUnknowns;
                const vsBase = numRealUnknowns + numSources;
                this.sources.forEach(({ p, n, v, rin }, k) => {
                    const vnet = virtualBase + k, vs = vsBase + k;
                    const g = 1 / rin;
                    const ip = idx(p);
                    A[vnet][vnet] += g;
                    if (ip >= 0) { A[ip][ip] += g; A[vnet][ip] -= g; A[ip][vnet] -= g; }
                    const iN = idx(n);
                    A[vnet][vs] += 1; A[vs][vnet] += 1;
                    if (iN >= 0) { A[iN][vs] += -1; A[vs][iN] += -1; }
                    b[vs] += v;
                });

                const x = gaussianSolve(A, b);
                const voltages = [0];
                for (let net = 1; net < numNets; net++) voltages.push(x[idx(net)]);
                const vsCurrents = [];
                for (let k = 0; k < numSources; k++) vsCurrents.push(x[vsBase + k]);
                return { voltages, vsCurrents };
            }
        }

        // Union-Find รวมขั้วต่อที่เชื่อมกันด้วยสายไฟ หรือสวิตช์ที่ปิดอยู่ ให้กลายเป็น "net" เดียวกัน
        function buildTerminalNets(components) {
            const parent = {};
            function find(x) {
                if (!(x in parent)) parent[x] = x;
                while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; }
                return x;
            }
            function union(a, b) {
                const ra = find(a), rb = find(b);
                if (ra !== rb) parent[ra] = rb;
            }
            components.forEach(c => { find(`${c.id}-t-pos`); find(`${c.id}-t-neg`); });
            wires.forEach(w => union(w.fromTerminalId, w.toTerminalId));
            components.forEach(c => {
                if (c.dataset.type === 'switch' && c.dataset.state === 'closed') {
                    union(`${c.id}-t-pos`, `${c.id}-t-neg`);
                }
            });
            return { find };
        }

        // สร้างวงจรจากอุปกรณ์ทั้งหมดบนกระดาน แล้วแก้สมการหาแรงดัน/กระแสจริงของทุกโหลดพร้อมกัน
        function buildAndSolveCircuit() {
            const components = Array.from(document.querySelectorAll('.dropped-component'));
            const batteries = components.filter(c => c.dataset.type === 'battery');
            if (batteries.length === 0) return null;

            const { find } = buildTerminalNets(components);
            const groundRoot = find(`${batteries[0].id}-t-neg`);
            const netIndexMap = new Map();
            let nextIndex = 1; // 0 สงวนไว้เป็น ground
            function netIndexOf(terminalId) {
                const root = find(terminalId);
                if (root === groundRoot) return 0;
                if (!netIndexMap.has(root)) netIndexMap.set(root, nextIndex++);
                return netIndexMap.get(root);
            }

            // อุปกรณ์แต่ละชิ้น -> element พร้อม net ของขั้วบวก/ลบ (สวิตช์ไม่ต้องมี element เพราะจัดการผ่าน union แล้ว)
            const resistorEls = [];
            const batteryEls = [];
            const ledEls = [];
            const motorEls = [];

            components.forEach(c => {
                const type = c.dataset.type;
                const nodeP = netIndexOf(`${c.id}-t-pos`);
                const nodeN = netIndexOf(`${c.id}-t-neg`);
                if (type === 'battery') {
                    const v = c.dataset.batType === '9V' ? 9.0 : parseInt(c.dataset.batCount) * 1.5;
                    batteryEls.push({ comp: c, nodeP, nodeN, v });
                } else if (type === 'resistor') {
                    resistorEls.push({ comp: c, nodeP, nodeN, r: parseInt(c.dataset.resValue) });
                } else if (type === 'motor') {
                    motorEls.push({ comp: c, nodeP, nodeN, r: MOTOR_INTERNAL_RESISTANCE });
                } else if (type === 'led') {
                    ledEls.push({ comp: c, nodeP, nodeN });
                }
            });

            // วนแก้สมการ: เริ่มจากสมมติ LED ทุกดวง "ติด" ก่อน ถ้าคำนวณแล้วกระแสติดลบ (แปลว่าแรงดันไม่พอ/ต่อกลับขั้ว)
            // ก็ปิดดวงนั้นแล้วคำนวณใหม่ ทำซ้ำจนเสถียร (ไม่มี LED ไหนต้องปิดเพิ่มแล้ว)
            let ledOnStates = ledEls.map(() => true);
            let voltages, vsCurrents, solver, motorCurrentOf = () => 0;

            for (let iter = 0; iter < ledEls.length + 2; iter++) {
                solver = new CircuitSolver();
                // จองหมายเลข net 0..(nextIndex-1) ให้ตรงกับที่ใช้จริง
                for (let i = 0; i < nextIndex; i++) solver.newNet();

                batteryEls.forEach(e => solver.addSource(e.nodeP, e.nodeN, e.v, BATTERY_INTERNAL_RESISTANCE));
                resistorEls.forEach(e => solver.addResistor(e.nodeP, e.nodeN, e.r));
                motorEls.forEach(e => solver.addResistor(e.nodeP, e.nodeN, e.r));

                const ledSourceIndexInVs = []; // index ของ LED ใน sources array (ตามลำดับ battery ก่อน แล้วค่อย LED ที่ ON)
                ledEls.forEach((e, i) => {
                    if (ledOnStates[i]) {
                        ledSourceIndexInVs.push(solver.sources.length);
                        solver.addSource(e.nodeP, e.nodeN, LED_FORWARD_VOLTAGE, LED_FORWARD_RESISTANCE);
                    } else {
                        ledSourceIndexInVs.push(-1); // ปิดอยู่ ไม่ได้เป็น source ในรอบนี้
                    }
                });

                const result = solver.solve();
                voltages = result.voltages;
                vsCurrents = result.vsCurrents;

                let changed = false;
                ledEls.forEach((e, i) => {
                    if (ledOnStates[i]) {
                        const current = vsCurrents[ledSourceIndexInVs[i]];
                        if (current < 0) { ledOnStates[i] = false; changed = true; }
                    }
                });
                if (!changed) break;
            }

            motorCurrentOf = (e) => (voltages[e.nodeP] - voltages[e.nodeN]) / e.r;

            return { voltages, vsCurrents, batteryEls, ledEls, ledOnStates, motorEls, motorCurrentOf };
        }

        function checkCircuitLogic() {
            stopAllEffects();

            const result = buildAndSolveCircuit();
            if (!result) return;

            recomputeAndApplyLoadVisuals(result);
        }

        // แยกฟังก์ชันย่อยสำหรับ apply ผลลัพธ์กลับเข้าอุปกรณ์ทุกตัว ให้โค้ดอ่านง่ายขึ้น
        function recomputeAndApplyLoadVisuals(result) {
            const { ledEls, ledOnStates, motorEls, motorCurrentOf, voltages } = result;

            // หา current ของ LED แต่ละดวงที่ ON โดย re-derive จาก voltages (V ตกคร่อม - Vf) / Rf เพื่อความชัวร์และง่ายต่อการอ่านโค้ด
            ledEls.forEach((e, i) => {
                const comp = e.comp;
                const bulb = document.getElementById(`${comp.id}-led-bulb`);
                const explosionG = document.getElementById(`${comp.id}-explosion`);
                const badge = document.getElementById(`${comp.id}-current-badge`);

                if (!ledOnStates[i]) {
                    if (bulb) { bulb.style.display = 'block'; bulb.setAttribute("fill", "#450a0a"); }
                    if (explosionG) explosionG.style.display = 'none';
                    if (badge) badge.style.display = 'none';
                    return;
                }

                const vDrop = voltages[e.nodeP] - voltages[e.nodeN];
                const current_mA = ((vDrop - LED_FORWARD_VOLTAGE) / LED_FORWARD_RESISTANCE) * 1000;

                if (badge) {
                    badge.style.display = 'block';
                    badge.textContent = `${current_mA.toFixed(1)} mA`;
                    badge.classList.toggle('danger', current_mA > LED_SAFE_MAX_MA);
                }

                if (current_mA > LED_SAFE_MAX_MA) {
                    if (bulb) bulb.style.display = 'none';
                    if (explosionG) explosionG.style.display = 'block';
                } else if (current_mA < 0.01) {
                    // แทบไม่มีกระแสไหลเลย (เช่น สวิตช์เปิดอยู่ วงจรขาดจริงๆ) ให้แสดงเป็นดับสนิท ไม่ใช่แค่แสงจาง
                    if (bulb) bulb.setAttribute("fill", "#450a0a");
                    if (badge) badge.style.display = 'none';
                } else if (current_mA < LED_SAFE_MIN_MA) {
                    if (bulb) bulb.setAttribute("fill", "#7f1d1d");
                } else {
                    if (bulb) {
                        bulb.setAttribute("fill", "#ef4444");
                        bulb.classList.add('led-glow');
                    }
                }
            });

            motorEls.forEach(e => {
                const comp = e.comp;
                const propeller = document.getElementById(`${comp.id}-propeller`);
                const badge = document.getElementById(`${comp.id}-current-badge`);
                const current_mA = motorCurrentOf(e) * 1000;
                // แปลงกระแสเป็นความเร็วรอบ (RPM) โดยเทียบสัดส่วนกับกระแส/ความเร็วพิกัดของมอเตอร์
                const rpm = current_mA >= MOTOR_MIN_SPIN_MA ? (current_mA / MOTOR_RATED_MA) * MOTOR_RATED_RPM : 0;

                if (badge) {
                    if (current_mA < 0.01) {
                        badge.style.display = 'none';
                    } else {
                        badge.style.display = 'block';
                        badge.textContent = `${Math.round(rpm)} RPM`;
                        badge.classList.remove('danger');
                    }
                }

                if (propeller && current_mA >= MOTOR_MIN_SPIN_MA) {
                    propeller.classList.add('motor-spin');
                    const duration = Math.max(0.15, Math.min(1.4, 80 / current_mA));
                    propeller.style.animationDuration = `${duration}s`;
                }
            });
        }


        function stopAllEffects() {
            document.querySelectorAll('[id$="-led-bulb"]').forEach(bulb => {
                bulb.style.display = 'block';
                bulb.setAttribute("fill", "#ef4444");
                bulb.classList.remove('led-glow');
            });
            document.querySelectorAll('[id$="-explosion"]').forEach(exp => {
                exp.style.display = 'none';
            });
            document.querySelectorAll('[id$="-propeller"]').forEach(prop => {
                prop.classList.remove('motor-spin');
                prop.style.animationDuration = '';
            });
            document.querySelectorAll('.current-badge').forEach(badge => {
                badge.style.display = 'none';
            });
        }

        // ================= เริ่มต้น: บันทึก snapshot กระดานเปล่าไว้เป็นจุดแรกของ Undo/Redo =================
        // ✅ Auto-restore: ไม่ได้บันทึก snapshot เปล่า ให้โหลด circuit ที่ทำค้างไว้ก่อนออกจากหน้า
        (function autoRestoreCircuit() {
            try {
                var saved = localStorage.getItem(getSandboxSaveKey());
                if (saved) {
                    var snap = JSON.parse(saved);
                    // ถ้ามีอุปกรณ์หรือสายไฟที่บันทึกไว้ ให้โหลดกลับทันที
                    if (snap && snap.components && snap.components.length > 0) {
                        restoreSnapshot(snap);
                        historyStack.push(snap); // ให้ state นี้เป็นจุดเริ่มต้นของ Undo
                        console.log('✅ โหลด circuit ที่ทำค้างไว้สำเร็จ (' + snap.components.length + ' ชิ้น)');
                        updateToolbarButtons();
                        return;
                    }
                }
            } catch(e) { console.warn('sandbox auto-restore error:', e); }
            // ไม่มีข้อมูลเก่า → บันทึก snapshot กระดานเปล่าเป็นจุดแรก
            pushHistory();
            updateToolbarButtons();
        })();
    </script>
</body>
</html>
