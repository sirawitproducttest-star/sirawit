<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OUTSIDE.LEARNING - DASHBOARD</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Chakra Petch', sans-serif;
        }

        body {
            background: #03112d url('homepage/background.svg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: #ffffff;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin-top: 16px;
            margin-bottom: 24px;
        }

        .dashboard-card {
            background: #ffffff;
            color: #333333;
            border-radius: 20px;
            padding: 28px 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: left;
        }

        /* ===== HEADER ===== */
        .dashboard-header {
            color: #03112d;
            font-size: 1.5rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 14px;
            margin-bottom: 20px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header-brand {
            font-size: 1.3rem;
            font-weight: 700;
            color: #03112d;
            line-height: 1.2;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-welcome {
            font-size: 0.82rem;
            color: #475569;
            font-weight: 400;
            text-align: right;
            line-height: 1.4;
        }

        /* ===== 3 DOTS DROPDOWN MENU ===== */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .btn-dots {
            background: transparent;
            color: #03112d;
            border: none;
            font-size: 1.6rem;
            font-weight: 700;
            cursor: pointer;
            padding: 0 5px;
            line-height: 1;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background-color: #ffffff;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            z-index: 100;
            overflow: hidden;
        }

        .dropdown-content a {
            color: #334155;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            border-bottom: 1px solid #f1f5f9;
            transition: background-color 0.2s;
        }

        .dropdown-content a:last-child {
            border-bottom: none;
            color: #ef4444;
        }

        .dropdown-content a:hover {
            background-color: #f8fafc;
            color: #0284c7;
        }

        .dropdown-content a:last-child:hover {
            color: #dc2626;
            background-color: #fef2f2;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        /* ===== PROGRESS ===== */
        .progression-section {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 22px;
        }

        .progress-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .progress-bar-container {
            width: 100%;
            height: 14px;
            background: #cbd5e1;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00d2ff, #0056b3);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        /* ===== CHAPTER ===== */
        .chapter-box {
            border-left: 5px solid #00d2ff;
            padding-left: 14px;
            margin-bottom: 20px;
        }

        .chapter-title {
            font-size: 1rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 14px;
            line-height: 1.4;
        }

        /* ===== ACTIVITY STEPS ===== */
        .btn-go {
            background: #03112d;
            color: #ffffff;
            border: none;
            padding: 9px 20px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.25s;
            text-decoration: none;
            display: inline-block;
            white-space: nowrap;
            min-height: 38px;
            line-height: 1;
            display: flex;
            align-items: center;
        }

        .btn-go:hover {
            background: #00d2ff;
            color: #03112d;
        }

        .btn-go.locked {
            background: #94a3b8 !important;
            color: #e2e8f0 !important;
            border: 1px dashed #64748b !important;
            cursor: not-allowed;
            box-shadow: none !important;
            opacity: 0.65;
            pointer-events: none;
        }

        .step-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .step-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-radius: 10px;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            transition: 0.25s;
        }

        .step-item.done {
            background: #f0fdf4;
            border-color: #86efac;
        }

        .step-item.active {
            background: #eff6ff;
            border-color: #93c5fd;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
        }

        .step-num {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
            background: #cbd5e1;
            color: #475569;
        }

        .step-item.done .step-num {
            background: #22c55e;
            color: #fff;
        }

        .step-item.active .step-num {
            background: #3b82f6;
            color: #fff;
        }

        .step-label {
            flex: 1;
            font-size: 0.92rem;
            font-weight: 600;
            color: #1e293b;
            line-height: 1.35;
        }

        .step-item.done .step-label {
            color: #15803d;
        }

        .step-status {
            font-size: 0.82rem;
            color: #64748b;
            flex-shrink: 0;
        }

        .step-item.done .step-status {
            color: #22c55e;
            font-weight: 700;
        }

        /* ===== MODAL & BUTTONS FOR PASSWORD CHANGE ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 17, 45, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            backdrop-filter: blur(5px);
        }

        .modal-box {
            background: #0d1e36;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .modal-box h3 {
            color: #00ffcc;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }

        .modal-input {
            width: 100%;
            background: rgba(16, 37, 66, 0.8);
            border: 1px solid #00d2ff;
            border-radius: 5px;
            padding: 12px;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 15px;
            text-align: center;
            outline: none;
        }

        .modal-input:focus {
            border-color: #00ffff;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
        }

        .btn-cancel {
            background: transparent;
            border: 2px solid #64748b;
            color: #cbd5e1;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }

        .btn-cancel:hover {
            background: #64748b;
            color: #fff;
        }

        .btn-cyber {
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 10px 20px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        }

        .btn-cyber:hover {
            background: #00ffff;
            color: #03112d;
            box-shadow: 0 0 20px #00ffff;
        }

        /* ===== MOBILE ≤ 480px ===== */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .dashboard-card {
                padding: 18px 14px;
                border-radius: 14px;
            }

            .header-brand {
                font-size: 1.05rem;
            }

            .user-welcome {
                font-size: 0.75rem;
            }

            .chapter-title {
                font-size: 0.9rem;
            }

            .step-item {
                flex-wrap: wrap;
                padding: 10px 12px;
                gap: 8px;
            }

            .step-label {
                font-size: 0.85rem;
                flex-basis: calc(100% - 46px);
            }

            .step-status {
                margin-left: auto;
            }

            .btn-go {
                padding: 8px 16px;
                font-size: 0.82rem;
                min-height: 36px;
            }

            .progress-title {
                font-size: 0.85rem;
            }
        }

        /* ===== TABLET ≤ 768px ===== */
        @media (max-width: 768px) {
            .dashboard-header {
                font-size: 1.2rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="dashboard-card">
            <h2 class="dashboard-header">
                <span class="header-brand">OUTSIDE.LEARNING<br>BY SIRAWIT</span>
                <div class="header-right">
                    <span class="user-welcome" id="welcomeText">ผู้เรียน: กำลังโหลด...</span>
                    <!-- Dropdown เมนู 3 จุด -->
                    <div class="dropdown">
                        <button class="btn-dots">⋮</button>
                        <div class="dropdown-content">
                            <a href="#" onclick="openChangePasswordModal()">เปลี่ยนรหัสผ่าน</a>
                            <a href="#" onclick="logout()">ออกจากระบบ</a>
                        </div>
                    </div>
                </div>
            </h2>

            <div class="progression-section">
                <div class="progress-title">
                    <span id="progressLabel">ความคืบหน้า 0/5</span>
                    <span id="progressPct">0%</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progressBar"></div>
                </div>
            </div>

            <div class="chapter-box">
                <h3 class="chapter-title">เรื่อง วัสดุ เครื่องมือช่าง กลไกไฟฟ้าและอิเล็กทรอนิกส์</h3>
                <div class="step-list" id="activityList">
                    <!-- สร้างโดย JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal เปลี่ยนรหัสผ่าน -->
    <div class="modal-overlay" id="changePasswordModal">
        <div class="modal-box">
            <h3>🔐 เปลี่ยนรหัสผ่าน</h3>
            <input type="password" id="oldPassword" class="modal-input" placeholder="รหัสผ่านเดิม">
            <input type="password" id="newPassword" class="modal-input" placeholder="รหัสผ่านใหม่ (อย่างน้อย 4 ตัว)">
            <input type="password" id="confirmPassword" class="modal-input" placeholder="ยืนยันรหัสผ่านใหม่">
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn-cancel" onclick="closeChangePasswordModal()">ยกเลิก</button>
                <button class="btn-cyber" style="flex: 1;" onclick="submitChangePassword()">บันทึกรหัสผ่าน</button>
            </div>
        </div>
    </div>

    <script>
        const ACTIVITIES = [
            {
                id: 'pretest',
                label: '📝 แบบทดสอบก่อนเรียน',
                href: 'quiz before lesson.html',
                color: '#ff3366',
                doneKey: 'pretestDone',
                requires: []
            },
            {
                id: 'quiz10s',
                label: '⚡ 1 คำถาม 10 วินาที',
                href: '10-sec question.html',
                color: '#22c55e',
                doneKey: 'quiz10sDone',
                requires: ['pretestDone'],
                repeatable: true
            },
            {
                id: 'sandbox',
                label: '🔌 Circuit Simulation',
                href: 'sandbox.html',
                color: '#0284c7',
                doneKey: 'sandboxDone',
                requires: ['pretestDone'],
                repeatable: true
            },
            {
                id: 'mahjong',
                label: '🀄 Mahjong วัสดุ เครื่องมือช่าง กลไกไฟฟ้าและอิเล็กทรอนิกส์',
                href: 'mahjong_game.html',
                color: '#3b82f6',
                doneKey: 'mahjongDone',
                requires: ['pretestDone'],
                repeatable: true
            },
            {
                id: 'posttest',
                label: '🏆 แบบทดสอบหลังเรียน',
                href: 'posttest.html',
                color: '#ff9900',
                doneKey: 'posttestDone',
                requires: ['pretestDone', 'quiz10sDone', 'sandboxDone', 'mahjongDone']
            }
        ];

        function renderActivities() {
            const list = document.getElementById('activityList');
            list.innerHTML = '';
            let doneCount = 0;

            ACTIVITIES.forEach((act, idx) => {
                const isDone = sessionStorage.getItem(act.doneKey) === 'true';
                const isUnlocked = act.requires.every(k => sessionStorage.getItem(k) === 'true');
                const isActive = !isDone && isUnlocked;
                const canRepeat = isDone && act.repeatable;
                if (isDone) doneCount++;

                const item = document.createElement('div');
                item.className = 'step-item' + (isDone ? ' done' : (isActive ? ' active' : ''));

                const numEl = document.createElement('div');
                numEl.className = 'step-num';
                numEl.textContent = isDone ? '✓' : (idx + 1);

                const labelEl = document.createElement('div');
                labelEl.className = 'step-label';
                labelEl.textContent = act.label;

                const rightEl = document.createElement('div');
                rightEl.className = 'step-status';
                rightEl.style.cssText = 'display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end;';

                if (isDone) {
                    const doneSpan = document.createElement('span');
                    doneSpan.textContent = 'เสร็จแล้ว ✅';
                    rightEl.appendChild(doneSpan);

                    if (canRepeat) {
                        const replayBtn = document.createElement('a');
                        replayBtn.href = act.href;
                        replayBtn.className = 'btn-go';
                        replayBtn.style.cssText = `background:${act.color}; padding:6px 14px; font-size:0.82rem; opacity:0.85;`;

                        if (act.id === 'sandbox') {
                            var _name = sessionStorage.getItem('studentName') || 'guest';
                            var _cls = sessionStorage.getItem('studentClass') || '-';
                            var _no = sessionStorage.getItem('studentNumber') || '0';
                            var saveKey = 'sandbox_circuit_' + _cls + '_' + _no + '_' + _name;
                            var savedCircuit = localStorage.getItem(saveKey);
                            var hasData = false;
                            try {
                                var snap = savedCircuit ? JSON.parse(savedCircuit) : null;
                                hasData = snap && snap.components && snap.components.length > 0;
                            } catch (e) { }
                            replayBtn.textContent = hasData ? '▶ ทำต่อ' : '🔄 เริ่มใหม่';
                        } else {
                            replayBtn.textContent = '🔄 เล่นอีกครั้ง';
                        }

                        rightEl.appendChild(replayBtn);
                    }
                } else if (isUnlocked) {
                    const btn = document.createElement('a');
                    btn.href = act.href;
                    btn.className = 'btn-go';
                    btn.style.background = act.color;
                    btn.style.padding = '8px 20px';
                    btn.style.fontSize = '0.95rem';
                    btn.textContent = 'เริ่มเลย »';
                    rightEl.appendChild(btn);
                } else {
                    rightEl.textContent = '🔒 ยังล็อคอยู่';
                }

                item.appendChild(numEl);
                item.appendChild(labelEl);
                item.appendChild(rightEl);
                list.appendChild(item);
            });

            const pct = Math.round((doneCount / ACTIVITIES.length) * 100);
            document.getElementById('progressLabel').textContent = `ความคืบหน้า ${doneCount}/${ACTIVITIES.length}`;
            document.getElementById('progressPct').textContent = pct + '%';
            document.getElementById('progressBar').style.width = pct + '%';
        }

        async function restoreDoneFlags() {
            var name = sessionStorage.getItem('studentName');
            var cls = sessionStorage.getItem('studentClass');
            var no = sessionStorage.getItem('studentNumber');
            if (!name) return;

            try {
                var { data } = await _supabase
                    .from('activity_logs')
                    .select('activity')
                    .eq('name', name).eq('class', cls).eq('no', 'No.' + no);

                if (data && data.length > 0) {
                    var done = data.map(function (r) { return r.activity; });
                    if (done.includes('pretest')) sessionStorage.setItem('pretestDone', 'true');
                    if (done.includes('quiz10s')) sessionStorage.setItem('quiz10sDone', 'true');
                    if (done.includes('mahjong')) sessionStorage.setItem('mahjongDone', 'true');
                    if (done.includes('posttest')) sessionStorage.setItem('posttestDone', 'true');
                }
            } catch (e) { console.warn('restoreDoneFlags (activity_logs) error:', e); }

            try {
                var sbRes = await _supabase
                    .from('sandbox_logs')
                    .select('id')
                    .eq('name', name).eq('class', cls).eq('no', no)
                    .limit(1);
                if (sbRes.data && sbRes.data.length > 0) {
                    sessionStorage.setItem('sandboxDone', 'true');
                }
            } catch (e) { console.warn('restoreDoneFlags (sandbox_logs) error:', e); }
        }

        window.onload = function () {
            if (sessionStorage.getItem('isLoggedIn') !== 'true') {
                window.location.href = 'login.html';
            } else {
                const name = sessionStorage.getItem('studentName');
                const sClass = sessionStorage.getItem('studentClass');
                const sNo = sessionStorage.getItem('studentNumber');
                document.getElementById('welcomeText').innerText = `ผู้เรียน ${name} ${sClass} เลขที่ ${sNo}`;
                restoreDoneFlags().then(function () {
                    renderActivities();
                });
            }
        }

        // ==========================================
        // ฟังก์ชันระบบเปลี่ยนรหัสผ่าน (ใช้งานได้จริง 100%)
        // ==========================================
        function openChangePasswordModal() {
            // ล้างค่าในช่องกรอกทุกครั้งที่เปิด
            document.getElementById('oldPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';

            document.getElementById('changePasswordModal').style.display = 'flex';
        }

        function closeChangePasswordModal() {
            document.getElementById('changePasswordModal').style.display = 'none';
        }

        async function submitChangePassword() {
            const oldPass = document.getElementById('oldPassword').value.trim();
            const newPass = document.getElementById('newPassword').value.trim();
            const confPass = document.getElementById('confirmPassword').value.trim();

            if (!oldPass || !newPass || !confPass) {
                alert('⚠️ กรุณากรอกข้อมูลให้ครบทุกช่องครับ');
                return;
            }

            if (newPass.length < 4) {
                alert('⚠️ รหัสผ่านใหม่ต้องมีความยาวอย่างน้อย 4 ตัวอักษรครับ');
                return;
            }

            if (newPass !== confPass) {
                alert('⚠️ รหัสผ่านใหม่และการยืนยันรหัสผ่านไม่ตรงกันครับ');
                return;
            }

            const name = sessionStorage.getItem('studentName');
            const sClass = sessionStorage.getItem('studentClass');
            const sNo = sessionStorage.getItem('studentNumber');

            try {
                // 1. ดึงข้อมูล User ปัจจุบันจาก DB เพื่อเช็กรหัสเดิม
                const { data: user, error: fetchError } = await _supabase
                    .from('students')
                    .select('id, password')
                    .eq('name', name)
                    .eq('class', sClass)
                    .eq('no', sNo)
                    .single();

                if (fetchError || !user) {
                    alert('❌ เกิดข้อผิดพลาดในการตรวจสอบผู้ใช้งาน กรุณาลองใหม่อีกครั้ง');
                    return;
                }

                if (user.password !== oldPass) {
                    alert('❌ รหัสผ่านเดิมไม่ถูกต้อง กรุณาตรวจสอบอีกครั้งครับ');
                    return;
                }

                // 2. หากรหัสเดิมถูกต้อง ทำการอัปเดตรหัสผ่านใหม่ลงตาราง
                const { error: updateError } = await _supabase
                    .from('students')
                    .update({ password: newPass })
                    .eq('id', user.id);

                if (updateError) {
                    alert('❌ เกิดข้อผิดพลาดในการอัปเดตรหัสผ่าน: ' + updateError.message);
                    return;
                }

                alert('✅ เปลี่ยนรหัสผ่านเรียบร้อยแล้ว! รหัสผ่านของคุณได้รับการอัปเดตอย่างสมบูรณ์');
                closeChangePasswordModal();

            } catch (err) {
                console.error('Error changing password:', err);
                alert('❌ เกิดข้อผิดพลาดในการเชื่อมต่อฐานข้อมูล');
            }
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
</body>

</html>
