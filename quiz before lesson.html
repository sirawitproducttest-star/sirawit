<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบทดสอบก่อนเรียน - OUTSIDE.LEARNING</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Chakra Petch', sans-serif;
        }

        body {
            background: #03112d url('homepage/background.svg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            /* เปลี่ยนเป็น flex-start เพื่อให้เลื่อนจอลงมาดูข้อสอบด้านล่างได้ */
            color: #ffffff;
            padding: 40px 20px;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(10, 34, 64, 0.3) 0%, rgba(3, 17, 45, 0.9) 100%);
            z-index: 1;
            position: fixed;
            /* ล็อกม่านสีเข้มให้อยู่กับที่เวลาเลื่อนจอ */
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 800px;
        }

        .quiz-header-card {
            background: rgba(3, 17, 45, 0.85);
            border: 2px solid #00d2ff;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.3);
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(8px);
            text-align: center;
            margin-bottom: 25px;
        }

        h2 {
            color: #00d2ff;
            font-size: 2rem;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        .sub-title {
            color: #88a4e6;
            font-size: 1.1rem;
            margin-top: 10px;
        }

        /* การ์ดข้อสอบแต่ละข้อ */
        .question-card {
            background: rgba(3, 17, 45, 0.85);
            border: 1px solid rgba(0, 210, 255, 0.4);
            border-radius: 12px;
            padding: 25px 30px;
            margin-bottom: 20px;
            backdrop-filter: blur(8px);
            transition: border-color 0.3s;
        }

        .question-card:hover {
            border-color: #00ffff;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        /* สไตล์ตัวเลือกแบบฟีล Google Forms (กดเลือกจากกล่องวงกลม) */
        .options-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-label {
            display: flex;
            align-items: center;
            background: rgba(16, 37, 66, 0.6);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 8px;
            padding: 14px 20px;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-label:hover {
            background: rgba(0, 255, 255, 0.05);
            border-color: #00ffff;
        }

        /* ซ่อน Radio Input จริงแล้วแต่งเองเพื่อความสวยล้ำ */
        .option-label input[type="radio"] {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #00d2ff;
            border-radius: 50%;
            margin-right: 15px;
            outline: none;
            position: relative;
            cursor: pointer;
            transition: 0.2s;
        }

        .option-label input[type="radio"]:checked {
            border-color: #00ffff;
            background: #00ffff;
            box-shadow: 0 0 8px #00ffff;
        }

        .option-label.active {
            background: rgba(0, 210, 255, 0.15);
            border-color: #00ffff;
            font-weight: 600;
        }

        /* ปุ่มส่งข้อสอบด้านล่างสุด */
        .footer-action {
            display: flex;
            justify-content: center;
            margin-top: 30px;
            margin-bottom: 50px;
        }

        .btn-submit {
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 15px 60px;
            font-size: 1.3rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 8px;
            text-transform: uppercase;
            transition: 0.3s;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        }

        .btn-submit:hover {
            background: #00ffff;
            color: #03112d;
            box-shadow: 0 0 25px #00ffff;
        }

        /* หน้าแสดงผลคะแนน */
        .result-card {
            background: rgba(3, 17, 45, 0.9);
            border: 2px solid #00ffcc;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
            border-radius: 15px;
            padding: 50px 30px;
            backdrop-filter: blur(8px);
            text-align: center;
            display: none;
        }

        .score-text {
            font-size: 4.5rem;
            font-weight: 700;
            color: #00ffcc;
            text-shadow: 0 0 25px rgba(0, 255, 204, 0.6);
            margin: 25px 0;
        }

        .btn-back {
            background: transparent;
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 12px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }

        .btn-back:hover {
            background: #00ffff;
            color: #03112d;
            box-shadow: 0 0 15px #00ffff;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- 1. ส่วนหน้าแบบทดสอบ (สไตล์ Google Forms) -->
        <div id="quiz-area">
            <div class="quiz-header-card">
                <h2>แบบทดสอบก่อนเรียน</h2>
                <p class="sub-title">เรื่อง วัสดุ เครื่องมือช่าง กลไกไฟฟ้าและอิเล็กทรอนิกส์</p>
                <p class="sub-title">ให้ทำด้วยตนเอง โดยไม่ต้อง search หรือใช้ AI ช่วย</p>
            </div>

            <!-- กล่องข้อสอบทั้งหมดจะถูกสร้างขึ้นตรงนี้โดย JavaScript -->
            <form id="quizForm">
                <div id="questions-container"></div>

                <div class="footer-action">
                    <button type="submit" class="btn-submit">ส่งข้อสอบ</button>
                </div>
            </form>
        </div>

        <!-- 2. ส่วนหน้าแสดงผลลัพธ์ตอนตรวจเสร็จ -->
        <div id="result-area" class="result-card">
            <h2>ส่งข้อสอบเรียบร้อยแล้ว!</h2>
            <div
                style="width: 80%; height: 2px; background: linear-gradient(90deg, transparent, #00ffcc, transparent); margin: 20px auto;">
            </div>
            <p style="font-size: 1.3rem; color: #88a4e6;">คะแนนรวมของคุณคือ</p>
            <div class="score-text" id="final-score">0 / 10</div>
            <p style="font-size: 1.1rem; margin-bottom: 35px; color: #cbd5e1;">
                ระบบตรวจสอบวิถีผลการเรียนรู้และบันทึกคะแนนเรียบร้อยแล้วครับ</p>
            <button class="btn-back" onclick="window.location.href='home.html'">กลับสู่หน้าหลัก</button>
        </div>
    </div>

    <script>
        // คลังโจทย์ 10 ข้อเหมือนเดิมเป๊ะครับครู
        const quizData = [
            {
                question: "1. ข้อใดต่อไปนี้จัดเป็นเครื่องมือประเภทวัดขนาดในงานช่าง",
                options: ["ค้อน", "ตลับเมตร", "ประแจวงแหวน", "สว่านกระแทก"],
                correct: 1
            },
            {
                question: "2. หากต้องการขันน็อตที่มีหัวเป็นรูปหกเหลี่ยม ควรเลือกใช้เครื่องมือใดจึงจะเหมาะสมที่สุด",
                options: ["ไขควงปากแบน", "คีมปากจระเข้", "ประแจปากตาย", "ค้อนหงอน"],
                correct: 2
            },
            {
                question: "3. ตัวต้านทาน (Resistor) ทำหน้าที่อะไรในวงจรไฟฟ้า",
                options: ["ผลิตกระแสไฟฟ้า", "เก็บสะสมประจุไฟฟ้า", "จำกัดและต้านทานการไหลของกระแสไฟฟ้า", "เป็นสวิตช์เปิด-ปิดไฟ"],
                correct: 2
            },
            {
                question: "4. สัญลักษณ์ขั้วบวก (+) ของหลอด LED มักสังเกตได้จากส่วนใดของตัวหลอดจริง",
                options: ["ขาที่ยาวกว่า", "ขาที่สั้นกว่า", "รอยบากที่ขอบหลอด", "ตัวหลอดที่มีสีเข้มกว่า"],
                correct: 0
            },
            {
                question: "5. เครื่องมือชนิดใดใช้สำหรับเจาะรูบนไม้ เหล็ก หรือกำแพงคอนกรีต",
                options: ["คีมปากแหลม", "ตะไบ", "สว่าน", "เลื่อยวงเดือน"],
                correct: 2
            },
            {
                question: "6. แหล่งจ่ายไฟฟ้ากระแสตรง (DC) ในชีวิตประจำวันคือข้อใด",
                options: ["เต้ารับไฟบ้าน", "ไดนาโมโรงไฟฟ้า", "ถ่านไฟฉาย / แบตเตอรี่", "แผงสวิตช์ไฟ"],
                correct: 2
            },
            {
                question: "7. สวิตช์ (Switch) ทำหน้าที่อะไรในวงจรไฟฟ้าพื้นฐาน",
                options: ["เพิ่มแรงดันไฟฟ้าให้สูงขึ้น", "ตัดหรือต่อวงจรไฟฟ้าเพื่อควบคุมการทำงาน", "ป้องกันไม่ให้ไฟดูด", "แปลงไฟฟ้ากระแสสลับเป็นกระแสตรง"],
                correct: 1
            },
            {
                question: "8. หากกระแสไฟฟ้าไหลผ่านหลอด LED มากเกินไปโดยไม่มีตัวต้านทานดักไว้ จะเกิดอะไรขึ้น",
                options: ["หลอดไฟจะสว่างน้อยลง", "หลอดไฟจะไม่ติดเลย", "หลอดไฟอาจจะขาดหรือเสียหายได้", "ประหยัดพลังงานมากขึ้น"],
                correct: 2
            },
            {
                question: "9. ข้อใดกล่าวถูกต้องเกี่ยวกับความปลอดภัยในการปฏิบัติงานช่าง",
                options: ["สวมถุงเท้าอย่างเดียวก็พอไม่ต้องใส่รองเท้า", "ตรวจเช็กสภาพเครื่องมือและสายไฟทุกครั้งก่อนใช้งาน", "ซ่อมอุปกรณ์ไฟฟ้าขณะที่มือเปียกน้ำเพื่อระบายความร้อน", "ใช้เครื่องมือผิดประเภทถ้าไม่มีเครื่องมือตรงรุ่น"],
                correct: 1
            },
            {
                question: "10. มอเตอร์กระแสตรง (DC Motor) ทำหน้าที่แปลงพลังงานไฟฟ้าเป็นพลังงานประเภทใด",
                options: ["พลังงานความร้อน", "พลังงานกล (การหมุน)", "พลังงานเคมี", "พลังงานเสียง"],
                correct: 1
            }
        ];

        const container = document.getElementById('questions-container');

        // ใช้ JS สร้างโครงสร้างกระดาษคำถามรวดเดียว 10 ข้อ
        quizData.forEach((q, qIdx) => {
            const card = document.createElement('div');
            card.className = 'question-card';

            let optionsHtml = '';
            q.options.forEach((opt, oIdx) => {
                optionsHtml += `
                    <label class="option-label" id="label-q${qIdx}-o${oIdx}">
                        <input type="radio" name="question${qIdx}" value="${oIdx}" onclick="highlightSelection(${qIdx}, ${oIdx})" required>
                        ${opt}
                    </label>
                `;
            });

            card.innerHTML = `
                <div class="question-text">${q.question}</div>
                <div class="options-group">
                    ${optionsHtml}
                </div>
            `;
            container.appendChild(card);
        });

        // ฟังก์ชันช่วยเปลี่ยนสีพื้นหลังให้กล่องตัวเลือกเด่นชัดขึ้นเมื่อเด็กคลิกเลือก
        function highlightSelection(qIdx, selectedOptIdx) {
            // เคลียร์สถานะ active เก่าของข้อนั้น ๆ
            for (let i = 0; i < 4; i++) {
                const label = document.getElementById(`label-q${qIdx}-o${i}`);
                if (label) label.classList.remove('active');
            }
            // ใส่คลาสกระตุ้นให้ข้อที่ถูกเลือกเรืองแสง
            const activeLabel = document.getElementById(`label-q${qIdx}-o${selectedOptIdx}`);
            if (activeLabel) activeLabel.classList.add('active');
        }

        // เมื่อเด็กกดส่งข้อสอบในฟอร์ม
        var pretestStartTime = Date.now();
        document.getElementById('quizForm').addEventListener('submit', function (e) {
            e.preventDefault(); // บล็อกไม่ให้หน้าเว็บรีเฟรชเอง

            let score = 0;

            // วนลูปตรวจคะแนนทั้ง 10 ข้อ
            quizData.forEach((q, qIdx) => {
                const checkedOption = document.querySelector(`input[name="question${qIdx}"]:checked`);
                if (checkedOption && parseInt(checkedOption.value) === q.correct) {
                    score++;
                }
            });

            // ซ่อนหน้าทำข้อสอบ แล้วโชว์ผลการสอบขึ้นมาทันที
            document.getElementById('quiz-area').style.display = 'none';
            document.getElementById('result-area').style.display = 'block';
            document.getElementById('final-score').innerText = `${score} / ${quizData.length}`;

            // บันทึกคะแนนลง sessionStorage เพื่อไปใช้งานต่อวันข้างหน้า
            sessionStorage.setItem('quizScore', score);
            sessionStorage.setItem('pretestDone', 'true'); // cache ไว้ใน session
            markPretestDone(); // ✅ บันทึกลง Supabase (คงอยู่ข้ามเครื่อง/ข้ามวัน)
            savePretestScore(score);

            // สั่งม้วนจอกลับไปด้านบนสุดด้วยความนุ่มนวลเพื่อให้เห็นผลคะแนนแบบสวย ๆ
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        async function markPretestDone() {
            var name = sessionStorage.getItem('studentName');
            var cls = sessionStorage.getItem('studentClass');
            var no = sessionStorage.getItem('studentNumber');
            if (!name) return;
            await _supabase.from('students')
                .update({ pretest_done: true })
                .eq('name', name).eq('class', cls).eq('no', no);
        }
        async function savePretestScore(score) {
            var name = sessionStorage.getItem('studentName') || 'student';
            var cls = sessionStorage.getItem('studentClass') || '-';
            var no = sessionStorage.getItem('studentNumber') || '0';
            var totalSec = Math.floor((Date.now() - pretestStartTime) / 1000);
            var mm = Math.floor(totalSec / 60).toString().padStart(2, '0');
            var ss = (totalSec % 60).toString().padStart(2, '0');
            var timeStr = mm + ' min ' + ss + ' sec';
            try {
                await _supabase.from('activity_logs').insert([{
                    name: name, class: cls, no: 'No.' + no,
                    activity: 'pretest',
                    score: score + ' / ' + quizData.length,
                    time_spent: timeStr,
                    hearts: '-'
                }]);
                console.log('Pretest score saved!');
            } catch (e) { console.error('Save pretest error:', e); }
        }
    </script>
</body>

</html>
