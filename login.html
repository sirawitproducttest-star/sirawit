<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OUTSIDE.LEARNING BY SIRAWIT - LOGIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Chakra Petch', sans-serif;
        }

        body {
            background: #03112d url('homepage/background.svg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        .login-card {
            background: rgba(3, 17, 45, 0.85);
            border: 2px solid #00d2ff;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.3);
            border-radius: 15px;
            padding: 40px 30px;
            backdrop-filter: blur(8px);
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        .divider {
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00d2ff, transparent);
            margin: 0 auto 30px auto;
        }

        .input-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 450px;
            margin-left: auto;
            margin-right: auto;
        }

        label {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: #00d2ff;
        }

        input {
            width: 100%;
            background: rgba(16, 37, 66, 0.8);
            border: 1px solid #00d2ff;
            border-radius: 5px;
            padding: 12px;
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
        }

        .btn-cyber {
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 12px 45px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 5px;
            text-transform: uppercase;
            transition: 0.3s;
            margin-top: 15px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        }

        .btn-cyber:hover {
            background: #00ffff;
            color: #03112d;
            box-shadow: 0 0 20px #00ffff;
        }
    </style>
    <!-- 1. ดึง Library Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>
</head>

<body>
    <div class="container">
        <div class="login-card">
            <h1>OUTSIDE.LEARNING BY SIRAWIT</h1>
            <div class="divider"></div>

            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="ชื่อผู้ใช้งาน" onkeydown="checkEnter(event)">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="รหัสผ่าน" onkeydown="checkEnter(event)">
            </div>

            <button class="btn-cyber" onclick="loginAndGo()">เข้าสู่ระบบ</button>
        </div>
    </div>

    <script>
        window.onload = function () {
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                const role = sessionStorage.getItem('userRole');
                if (role === 'admin' || role === 'substitute') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'home.html';
                }
            }
        }

        function checkEnter(event) {
            if (event.key === 'Enter') {
                loginAndGo();
            }
        }

        async function loginAndGo() {
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();

            if (!usernameInput || !passwordInput) {
                alert('กรุณากรอก Username และ Password ให้ครบถ้วนครับ');
                return;
            }

            // ── Query Supabase ──
            const { data: candidates, error } = await _supabase
                .from('students')
                .select('*')
                .eq('username', usernameInput)
                .eq('password', passwordInput);

            if (error) {
                if (error.code === 'PGRST301' || error.message.includes('RLS')) {
                    alert(
                        '❌ ไม่สามารถเชื่อมต่อฐานข้อมูลได้\n\n' +
                        '⚠️ สาเหตุ: RLS บล็อกการเข้าถึง\n' +
                        'กรุณาแจ้งครูผู้สอนเพื่อแก้ไขการตั้งค่าครับ'
                    );
                } else {
                    alert('❌ เกิดข้อผิดพลาด: ' + error.message);
                }
                return;
            }

            if (!candidates || candidates.length === 0) {
                alert('❌ Username หรือ Password ไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง');
                return;
            }

            const user = candidates[0]; // ดึงข้อมูล user ที่ตรงกับรหัส

            // ── ตรวจสอบว่าถูกบล็อกหรือไม่ ──
            if (user.is_blocked) {
                alert('🚫 บัญชีนี้ถูกระงับการใช้งาน\nกรุณาติดต่อครูผู้สอนครับ');
                return;
            }

            // ✅ บันทึก Session
            sessionStorage.setItem('isLoggedIn', 'true');
            sessionStorage.setItem('studentName', user.name);
            sessionStorage.setItem('studentClass', user.class);
            sessionStorage.setItem('studentNumber', user.no);
            sessionStorage.setItem('userRole', user.role);

            // 🔑 Redirect ตาม role
            if (user.role === 'admin' || user.role === 'substitute') {
                const roleLabel = user.role === 'admin' ? 'ครูประจำวิชา' : 'ครูสอนแทน';
                alert('✅ ยินดีต้อนรับ ' + user.name + ' (' + roleLabel + ')');
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'home.html';
            }
        }
    </script>
</body>

</html>
