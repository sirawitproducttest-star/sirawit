<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OUTSIDE.LEARNING BY SIRAWIT - LOGIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Chakra Petch', sans-serif;
        }

        body {
            background: #03112d url('homepage/background.svg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        .login-card {
            background: rgba(3, 17, 45, 0.85);
            border: 2px solid #00d2ff;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.3);
            border-radius: 15px;
            padding: 40px 30px;
            backdrop-filter: blur(8px);
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        .divider {
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00d2ff, transparent);
            margin: 0 auto 30px auto;
        }

        .input-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .input-row {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 450px;
            margin: 0 auto 25px auto;
        }

        .input-sub-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        label {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: #00d2ff;
        }

        input,
        select {
            width: 100%;
            background: rgba(16, 37, 66, 0.8);
            border: 1px solid #00d2ff;
            border-radius: 5px;
            padding: 12px;
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
        }

        select {
            text-align-last: center;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='cyan' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 10px center;
        }

        select option {
            background: #0d1e36;
            color: #fff;
        }

        .btn-cyber {
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 12px 45px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 5px;
            text-transform: uppercase;
            transition: 0.3s;
            margin-top: 15px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        }

        .btn-cyber:hover {
            background: #00ffff;
            color: #03112d;
            box-shadow: 0 0 20px #00ffff;
        }

    </style>
    <!-- 1. ดึง Library Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // 2. ใส่ URL และ Key ที่ก๊อปมาจาก Supabase
        const SUPABASE_URL = 'https://syadfbmtewdkexsmfjrp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN5YWRmYm10ZXdka2V4c21manJwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MDI0MTcsImV4cCI6MjEwMjM3ODQxN30.yROrRKWUVre99ZCWgGxaG1IAKnKFaLdtdcqyIO3IhPQ';

        // 3. สร้าง ตัวเชื่อมต่อสำหรับใช้งาน
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    </script>
</head>

<body>
    <div class="container">
        <div class="login-card">
            <h1>OUTSIDE.LEARNING BY SIRAWIT</h1>
            <div class="divider"></div>
            <div class="input-group">
                <label>ชื่อ - สกุล</label>
                <input type="text" id="studentName" placeholder="กรอกชื่อและนามสกุล">
            </div>
            <div class="input-row">
                <div class="input-sub-group">
                    <label>ชั้น</label>
                    <select id="studentClass">
                        <option value="ม.1/1">ม.1/1</option>
                        <option value="ม.1/2">ม.1/2</option>
                        <option value="ม.1/3">ม.1/3</option>
                        <option value="ม.1/4">ม.1/4</option>
                        <option value="ม.1/5">ม.1/5</option>
                        <option value="ม.1/6">ม.1/6</option>
                        <!-- เพิ่ม option - สำหรับบัญชีครูผู้สอน/ผู้ดูแล -->
                        <option value="-">-</option>
                    </select>
                </div>
                <div class="input-sub-group">
                    <label>เลขที่</label>
                    <!-- เปลี่ยน type เป็น text เพื่อรองรับการกรอกเลขที่ 00 สำหรับ Admin -->
                    <input type="text" id="studentNumber" placeholder="1">
                </div>
            </div>
            <button class="btn-cyber" onclick="loginAndGo()">เข้าสู่ระบบ</button>
        </div>
    </div>

    <script>


        window.onload = function () {
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                const role = sessionStorage.getItem('userRole');
                if (role === 'admin' || role === 'substitute') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'home.html';
                }
            }
        }
        async function loginAndGo() {
            const name = document.getElementById('studentName').value.trim().normalize('NFC');
            const sClass = document.getElementById('studentClass').value;
            const sNoRaw = document.getElementById('studentNumber').value.trim();

            if (!name || !sNoRaw) {
                alert('กรุณากรอกชื่อ-นามสกุล และเลขที่ให้ครบถ้วนครับ');
                return;
            }

            // ── Pad เลขที่ให้เป็น 2 หลักเพื่อให้ตรงกับ DB (01, 02, ... 14) ──
            // Admin ใช้ค่า '-' ซึ่งไม่ต้อง pad
            const sNo = (sClass === '-' || isNaN(Number(sNoRaw)))
                ? sNoRaw
                : String(Number(sNoRaw)).padStart(2, '0');



            // ── Query Supabase ──
            const { data: candidates, error } = await _supabase
                .from('students')
                .select('*')
                .eq('class', sClass)
                .eq('no', sNo);

            if (error) {
                if (error.code === 'PGRST301' || error.message.includes('RLS')) {
                    alert(
                        '❌ ไม่สามารถเชื่อมต่อฐานข้อมูลได้\n\n' +
                        '⚠️ สาเหตุ: RLS บล็อกการเข้าถึง\n' +
                        'กรุณาแจ้งครูผู้สอนเพื่อแก้ไขการตั้งค่าครับ'
                    );
                } else {
                    alert('❌ เกิดข้อผิดพลาด: ' + error.message);
                }
                return;
            }



            if (!candidates || candidates.length === 0) {
                alert(
                    '❌ ไม่พบข้อมูลในระบบ\n\n' +
                    'ชั้น: ' + sClass + '  |  เลขที่: ' + sNo + '\n\n' +
                    'กรุณาตรวจสอบ: ชั้นเรียน และเลขที่ให้ถูกต้อง'
                );
                return;
            }

            // ── เทียบชื่อ (NFC normalize) ──
            const user = candidates.find(u => u.name.trim().normalize('NFC') === name);
            if (!user) {
                const dbNames = candidates.map(u => '"' + u.name + '"').join(', ');
                alert(
                    '❌ ชื่อ-นามสกุลไม่ถูกต้อง\n\n' +
                    'กรอกมา: ' + name + '\n' +
                    'ในระบบ: ' + dbNames + '\n\n' +
                    'กรุณาตรวจสอบการสะกดชื่อให้ตรงกับที่ลงทะเบียนไว้ครับ'
                );
                return;
            }

            // ── ตรวจสอบว่าถูกบล็อกหรือไม่ ──
            if (user.is_blocked) {
                alert('🚫 บัญชีนี้ถูกระงับการใช้งาน\nกรุณาติดต่อครูผู้สอนครับ');
                return;
            }

            // ✅ บันทึก Session
            sessionStorage.setItem('isLoggedIn', 'true');
            sessionStorage.setItem('studentName', user.name);
            sessionStorage.setItem('studentClass', user.class);
            sessionStorage.setItem('studentNumber', user.no);
            sessionStorage.setItem('userRole', user.role);

            // 🔑 Redirect ตาม role
            if (user.role === 'admin' || user.role === 'substitute') {
                const roleLabel = user.role === 'admin' ? 'ครูประจำวิชา' : 'ครูสอนแทน';
                alert('✅ ยินดีต้อนรับ ' + user.name + ' (' + roleLabel + ')');
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'home.html';
            }
        }
    </script>
</body>

</html>
